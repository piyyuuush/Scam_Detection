[project]
name = "cyberthreatdetect"
version = "0.1.0"
description = "CyberThreatDetect: AI-driven cybersecurity analysis platform for comparing ML/DL threat detection models."
readme = "README.md"
authors = [
    { name = "Trilogy Innovations" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27.0",
    "matplotlib>=3.9.0",
    "numpy>=2.0.0",
    "pandas>=2.2.0",
    "pydantic>=2.8.0",
    "scikit-learn>=1.5.0",
    "torch>=2.4.0",
    "tqdm>=4.66.0",
    "typer>=0.12.0",
    "streamlit>=1.36.0",
]

[dependency-groups]
dev = [
    "mypy>=1.11.0",
    "pandas-stubs>=3.0.0.260204",
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "scikit-learn-stubs>=0.0.3",
    "types-tqdm>=4.66.0.20240417",
]

[project.scripts]
ctd = "cyberthreatdetect.ui.cli:main"

[build-system]
requires = ["uv_build>=0.8.22,<0.9.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "N"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
disallow_any_generics = true
disallow_subclassing_any = true
no_implicit_optional = true
warn_return_any = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["streamlit.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
